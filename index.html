<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aenet · 小朋友英语学习舱</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/baloo-2@1.0.4/fonts/baloo2.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/baloo-2/1.0.4/fonts/baloo2.css" rel="stylesheet">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#EAF4FF; --bg-2:#FFF7E6;
  --card:#FFFFFF; --card-soft:#F4FAFF;
  --ink:#274C77; --ink-2:#5F7D9C; --ink-3:#93ACBF;
  --blue:#3E8EDE; --blue-d:#2C66B0; --blue-bg:#E3F1FF;
  --sun:#FFC145; --sun-d:#EFA838; --sun-bg:#FFF3D6;
  --coral:#FF7A59; --coral-d:#E55B3C; --coral-bg:#FFE9E2;
  --green:#2FC97F; --green-d:#17A564; --green-bg:#DFF7EB;
  --red:#F2665E; --red-bg:#FDE7E5;
  --r-lg:24px; --r-md:18px; --r-sm:12px;
  --line:rgba(39,76,119,.10);
  --sh-card:0 4px 0 rgba(39,76,119,.06), 0 12px 28px rgba(39,76,119,.10);
  --sh-btn:0 5px 0 var(--btn-d, #2C66B0);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:"Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6;
  min-height:100vh; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(520px 340px at 88% -6%, rgba(255,193,69,.32), transparent 60%),
    radial-gradient(460px 320px at -6% 4%, rgba(62,142,222,.18), transparent 60%),
    radial-gradient(560px 400px at 50% 110%, rgba(47,201,127,.14), transparent 60%),
    var(--bg);
}
.en{font-family:"Baloo 2", "Comic Sans MS", "Segoe Print", cursive}
button{font-family:inherit; border:none; cursor:pointer; color:inherit; background:none}
input,textarea{font-family:inherit; color:inherit}
svg{display:block}
.hidden{display:none!important}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:12px;
  padding:12px 20px; max-width:960px; margin:0 auto;
}
.logo{display:flex; align-items:center; gap:10px; user-select:none}
.logo-mark{
  width:44px; height:44px; border-radius:14px; flex:none;
  background:linear-gradient(135deg,#FFC145,#FF9A3D);
  box-shadow:0 4px 0 rgba(224,150,58,.35);
  display:flex; align-items:center; justify-content:center;
}
.logo-name{font-size:26px; font-weight:700; line-height:1; letter-spacing:.5px}
.logo-name b{color:var(--blue)}
.topbar .spacer{flex:1}
.top-chip{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--card); border-radius:999px; padding:7px 14px;
  font-weight:700; font-size:14px; box-shadow:var(--sh-card);
}
.top-chip .star{color:var(--sun-d); width:18px; height:18px}
.icon-btn{
  width:42px; height:42px; border-radius:14px; background:var(--card);
  box-shadow:var(--sh-card); display:flex; align-items:center; justify-content:center;
  color:var(--ink-2); transition:transform .12s;
}
.icon-btn:hover{transform:translateY(-1px); color:var(--coral)}
.icon-btn:active{transform:translateY(1px)}

/* ============ 主视图 ============ */
main{max-width:960px; margin:0 auto; padding:8px 20px 120px}
.view-head{margin:6px 2px 18px}
.view-title{font-size:30px; font-weight:900; letter-spacing:.5px}
.view-sub{color:var(--ink-2); font-size:15px; margin-top:4px}

/* ============ 卡片 ============ */
.card{
  background:var(--card); border-radius:var(--r-lg); padding:22px;
  box-shadow:var(--sh-card);
}
.card + .card{margin-top:16px}
.card-title{font-size:18px; font-weight:900; display:flex; align-items:center; gap:8px; margin-bottom:14px}
.card-title .ic{color:var(--blue)}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:52px; padding:0 22px; border-radius:16px;
  font-size:16px; font-weight:900; color:#fff;
  background:var(--blue); --btn-d:var(--blue-d);
  box-shadow:var(--sh-btn); transform:translateY(-2px);
  transition:transform .1s, box-shadow .1s;
}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--btn-d)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none; box-shadow:0 5px 0 rgba(128,146,163,.35)}
.btn.coral{background:var(--coral); --btn-d:var(--coral-d)}
.btn.sun{background:var(--sun); --btn-d:var(--sun-d); color:#7A5410}
.btn.green{background:var(--green); --btn-d:var(--green-d)}
.btn.ghost{
  background:var(--card-soft); color:var(--blue); box-shadow:none; border:2px solid var(--line);
  transform:none;
}
.btn.ghost:active{transform:translateY(1px)}
.btn.sm{min-height:42px; padding:0 16px; font-size:14px; border-radius:13px}
.btn.block{width:100%}

/* ============ Chip 选择器 ============ */
.chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:10px 16px; border-radius:999px; border:2px solid var(--line);
  background:var(--card); font-weight:700; font-size:14px; color:var(--ink-2);
  transition:all .15s; user-select:none;
}
.chip:hover{border-color:var(--blue); color:var(--blue)}
.chip.on{
  background:var(--blue-bg); border-color:var(--blue); color:var(--blue);
}
.chip.coral.on{background:var(--coral-bg); border-color:var(--coral); color:var(--coral-d)}
.chip.green.on{background:var(--green-bg); border-color:var(--green); color:var(--green-d)}
.chip.sun.on{background:var(--sun-bg); border-color:var(--sun); color:#8A6312}
.chip .ck{width:16px; height:16px; display:none}
.chip.on .ck{display:block}
.chip-row{display:flex; flex-wrap:wrap; gap:10px}

/* ============ 首页 ============ */
.hero{
  border-radius:32px; padding:28px 26px; position:relative; overflow:hidden;
  background:linear-gradient(135deg,#3E8EDE 0%, #4FA8F2 55%, #6FC0FF 100%);
  color:#fff; box-shadow:0 10px 30px rgba(62,142,222,.35);
}
.hero .badge svg{width:15px;height:15px}
.hero .badge{
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,.18); border-radius:999px; padding:5px 12px;
  font-size:13px; font-weight:700;
}
.hero h1{font-size:36px; font-weight:900; line-height:1.2; margin:12px 0 6px}
.hero p{font-size:15px; opacity:.94; max-width:520px}
.hero .steps{
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px;
}
.hero .step{
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22);
  border-radius:18px; padding:12px 10px; text-align:center;
}
.hero .step .n{
  width:28px; height:28px; border-radius:10px; background:#fff; color:var(--blue);
  font-weight:900; display:flex; align-items:center; justify-content:center; margin:0 auto 6px;
}
.hero .step .t{font-size:13.5px; font-weight:900}
.hero .step .d{font-size:11.5px; opacity:.9; margin-top:2px}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px}
.stat-card{
  background:var(--card); border-radius:var(--r-lg); padding:14px 12px;
  box-shadow:var(--sh-card); text-align:center;
}
.stat-card .num{font-size:27px; font-weight:900; line-height:1.1}
.stat-card .lab{font-size:12.5px; color:var(--ink-2); font-weight:700; margin-top:2px}
.stat-card .ic{width:24px; height:24px; margin:0 auto 5px}
.quick-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px}
.quick{
  border-radius:var(--r-lg); padding:18px; text-align:left; color:#fff;
  box-shadow:var(--sh-btn); transform:translateY(-2px);
  transition:transform .12s; position:relative; overflow:hidden;
}
.quick:active{transform:translateY(2px); box-shadow:none}
.quick .q-t{font-size:18px; font-weight:900; display:flex; align-items:center; gap:8px}
.quick .q-d{font-size:13px; opacity:.92; margin-top:4px}
.quick .q-ic{position:absolute; right:14px; bottom:10px; width:56px; height:56px; opacity:.25}
.q-blue{background:linear-gradient(135deg,#3E8EDE,#5AAEF5)}
.q-coral{background:linear-gradient(135deg,#FF7A59,#FF9A70)}
.q-sun{background:linear-gradient(135deg,#FFC145,#FF9A3D)}
.q-green{background:linear-gradient(135deg,#2FC97F,#58DDA0)}
.workflow{margin-top:16px}
.flow-item{display:flex; gap:16px; padding:16px 0; border-bottom:1px dashed var(--line)}
.flow-item:last-child{border-bottom:none}
.flow-item .f-n{
  flex:none; width:38px; height:38px; border-radius:13px;
  background:var(--blue-bg); color:var(--blue); font-weight:900; font-size:17px;
  display:flex; align-items:center; justify-content:center;
}
.flow-item .f-t{font-weight:900; font-size:16px}
.flow-item .f-d{font-size:14px; color:var(--ink-2); margin-top:2px}

/* ============ 单元 / 课程 ============ */
.unit-card{
  display:flex; align-items:center; gap:16px;
  background:var(--card); border-radius:var(--r-lg); padding:18px 20px;
  box-shadow:var(--sh-card); cursor:pointer; transition:transform .12s;
  border-left:8px solid var(--uc, var(--blue));
}
.unit-card:hover{transform:translateY(-2px)}
.unit-card .u-no{font-size:13px; font-weight:900; color:var(--uc, var(--blue))}
.unit-card .u-t{font-size:19px; font-weight:900; line-height:1.2}
.unit-card .u-meta{font-size:13px; color:var(--ink-2); margin-top:2px}
.unit-card .u-prog{flex:1}
.prog-dots{display:flex; gap:5px; margin-top:6px}
.prog-dots i{width:14px; height:14px; border-radius:50%; background:var(--line); display:block}
.prog-dots i.on{background:var(--green)}
.prog-dots i.half{background:var(--sun)}
.word-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px}
.word-card{
  background:var(--card); border-radius:var(--r-md); padding:14px 16px;
  box-shadow:var(--sh-card); display:flex; align-items:center; gap:12px;
}
.word-card .wc-main{flex:1; min-width:0}
.word-card .wc-en{font-size:21px; font-weight:700; line-height:1.15; word-break:break-word}
.word-card .wc-ipa{font-size:13px; color:var(--ink-2); font-family:Consolas, monospace}
.word-card .wc-zh{font-size:14px; font-weight:700; color:var(--ink-2); margin-top:2px}
.word-card .wc-tag{
  font-size:11px; font-weight:900; padding:2px 8px; border-radius:999px;
  background:var(--sun-bg); color:#8A6312; margin-left:6px; vertical-align:2px;
}
.mini-btn{
  width:36px; height:36px; border-radius:12px; flex:none;
  background:var(--card-soft); display:flex; align-items:center; justify-content:center;
  color:var(--blue); transition:transform .1s;
}
.mini-btn:hover{transform:scale(1.08)}
.mini-btn.coral{color:var(--coral)}
.master-chip{
  font-size:11px; font-weight:900; padding:3px 9px; border-radius:999px; flex:none;
  background:var(--ink-3); color:#fff;
}
.master-chip.on{background:var(--green)}
.master-chip.run{background:var(--sun-d); color:#fff}
.master-chip.learn{background:var(--coral); color:#fff}
.dlg-card{background:var(--card); border-radius:var(--r-lg); padding:20px; box-shadow:var(--sh-card)}
.dlg-title{font-size:18px; font-weight:900; display:flex; align-items:center; gap:8px; margin-bottom:4px}
.dlg-sub{font-size:13px; color:var(--ink-2); margin-bottom:14px}
.dlg-line{
  display:grid; grid-template-columns:56px 1fr; gap:10px; padding:12px 0;
  border-bottom:1px dashed var(--line); align-items:start;
}
.dlg-line:last-child{border-bottom:none}
.dlg-line .who{
  background:var(--blue-bg); color:var(--blue); font-weight:900; font-size:13px;
  border-radius:10px; padding:4px 0; text-align:center;
}
.dlg-line .en-txt{font-size:17px; font-weight:700}
.dlg-line .ipa-txt{font-size:12px; color:var(--ink-2); font-family:Consolas,monospace; margin-top:1px}
.dlg-line .zh-txt{font-size:14px; color:var(--ink-2); margin-top:2px}
.dlg-line .play{float:right}

/* ============ 导入 ============ */
.import-area{
  border:3px dashed var(--blue); border-radius:var(--r-lg);
  background:var(--blue-bg); padding:22px; cursor:pointer;
  transition:background .15s;
}
.import-area.drag{background:#D5EAFF}
.import-area .ia-t{font-weight:900; font-size:16px; display:flex; align-items:center; gap:8px; justify-content:center}
.import-area .ia-d{font-size:13px; color:var(--ink-2); text-align:center; margin-top:4px}
textarea.parse-src{
  width:100%; min-height:220px; border:2px solid var(--line); border-radius:var(--r-md);
  padding:14px; font-size:14px; line-height:1.7; resize:vertical; background:var(--card);
  outline:none; transition:border .15s;
}
textarea.parse-src:focus{border-color:var(--blue)}
.preview-block{background:var(--card-soft); border-radius:var(--r-md); padding:14px 16px; margin-top:10px}
.preview-block .pb-t{font-weight:900; font-size:14px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center}
.preview-unit{border-top:1px dashed var(--line); padding:10px 0}
.preview-unit .pu-t{font-weight:900; color:var(--blue)}
.preview-unit .pu-m{font-size:13px; color:var(--ink-2)}

/* ============ 考试配置 ============ */
.exam-sec{margin-bottom:22px}
.exam-sec .sec-lab{font-weight:900; font-size:15px; margin-bottom:10px; display:flex; align-items:center; gap:8px}
.exam-sec .sec-lab .tip{font-weight:500; font-size:12px; color:var(--ink-3); margin-left:auto}
.diff-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.diff-card{
  border-radius:var(--r-md); padding:16px; text-align:center; cursor:pointer;
  background:var(--card); border:3px solid var(--line); transition:all .15s;
}
.diff-card:hover{border-color:var(--blue)}
.diff-card.on{border-color:var(--blue); background:var(--blue-bg)}
.diff-card .d-n{font-size:22px; font-weight:900}
.diff-card .d-l{font-size:13px; font-weight:700; margin-top:2px}
.diff-card .d-s{font-size:12px; color:var(--ink-2); margin-top:4px}
.rule-note{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--sun-bg); border-radius:var(--r-md); padding:14px 16px;
  font-size:13px; color:#7A5410; margin-top:14px;
}
.rule-note svg{flex:none; margin-top:2px}

/* ============ 考试进行 ============ */
.quiz-shell{
  position:fixed; inset:0; z-index:60; background:var(--bg);
  display:flex; flex-direction:column; overflow-y:auto;
}
.quiz-top{
  position:sticky; top:0; z-index:5; background:rgba(234,244,255,.92);
  backdrop-filter:blur(6px); padding:14px 20px 10px;
}
.quiz-top .qt-row{display:flex; align-items:center; gap:14px; max-width:720px; margin:0 auto}
.quiz-progress{flex:1; height:14px; background:#D5E6F7; border-radius:999px; overflow:hidden}
.quiz-progress i{display:block; height:100%; background:linear-gradient(90deg,#3E8EDE,#6FC0FF); border-radius:999px; transition:width .3s}
.quiz-score{font-weight:900; font-size:15px; display:flex; align-items:center; gap:4px}
.quiz-score .star{color:var(--sun-d); width:18px; height:18px}
.quiz-body{flex:1; max-width:720px; margin:0 auto; width:100%; padding:24px 20px 40px}
.q-card{
  background:var(--card); border-radius:var(--r-lg); padding:28px 24px;
  box-shadow:var(--sh-card);
}
.q-tag{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:900;
  padding:4px 12px; border-radius:999px; background:var(--coral-bg); color:var(--coral-d)}
.q-tag.blue{background:var(--blue-bg); color:var(--blue)}
.q-tag.green{background:var(--green-bg); color:var(--green-d)}
.q-tag.sun{background:var(--sun-bg); color:#8A6312}
.q-prompt{margin-top:16px; text-align:center}
.q-prompt .big-en{font-size:40px; font-weight:700; line-height:1.25; word-break:break-word}
.q-prompt .big-zh{font-size:24px; font-weight:900; margin-top:10px; color:var(--ink)}
.q-prompt .ipa{font-size:15px; color:var(--ink-2); font-family:Consolas,monospace; margin-top:6px}
.q-prompt .hint{font-size:14px; color:var(--ink-2); margin-top:12px}
.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:22px}
.opt{
  min-height:64px; border-radius:var(--r-md); border:2px solid var(--line);
  background:var(--card); padding:12px 14px; font-size:16px; font-weight:700;
  display:flex; align-items:center; gap:10px; text-align:left; transition:all .12s;
}
.opt:hover{border-color:var(--blue); background:var(--blue-bg)}
.opt .o-key{
  flex:none; width:30px; height:30px; border-radius:10px; background:var(--card-soft);
  color:var(--blue); font-weight:900; display:flex; align-items:center; justify-content:center; font-size:13px;
}
.opt.correct{border-color:var(--green); background:var(--green-bg)}
.opt.correct .o-key{background:var(--green); color:#fff}
.opt.wrong{border-color:var(--red); background:var(--red-bg)}
.opt.wrong .o-key{background:var(--red); color:#fff}
.opt:disabled{cursor:default; opacity:1}
.type-row{display:flex; gap:12px; margin-top:22px}
.type-row input{
  flex:1; min-height:56px; border-radius:16px; border:2px solid var(--line);
  padding:0 18px; font-size:19px; font-weight:700; outline:none; background:var(--card);
}
.type-row input:focus{border-color:var(--blue)}
.speak-area{margin-top:22px; text-align:center}
.mic-btn{
  width:112px; height:112px; border-radius:50%; margin:0 auto;
  background:linear-gradient(135deg,#FF7A59,#FF9A70); color:#fff;
  box-shadow:0 6px 0 var(--coral-d); display:flex; align-items:center; justify-content:center;
  transition:transform .1s; position:relative;
}
.mic-btn:active{transform:scale(.96)}
.mic-btn.listening{animation:pulse 1.2s infinite}
.mic-btn svg{width:46px;height:46px}
.quick .q-ic svg{width:52px;height:52px}
.fb-banner .fb-ic svg{width:24px;height:24px}
.stat-card .ic svg{width:26px;height:26px}
@keyframes pulse{
  0%{box-shadow:0 6px 0 var(--coral-d), 0 0 0 0 rgba(255,122,89,.45)}
  70%{box-shadow:0 6px 0 var(--coral-d), 0 0 0 26px rgba(255,122,89,0)}
  100%{box-shadow:0 6px 0 var(--coral-d), 0 0 0 0 rgba(255,122,89,0)}
}
.asr-line{margin-top:14px; min-height:26px; font-size:16px; font-weight:700; color:var(--ink-2)}
.self-check{display:flex; gap:10px; justify-content:center; margin-top:12px}
.hw-area{margin-top:18px; text-align:center}
.hw-canvas-wrap{position:relative; display:inline-block}
.hw-canvas-wrap canvas{
  background:#fff; border:3px dashed var(--blue); border-radius:var(--r-md);
  touch-action:none; max-width:100%;
}
.hw-guide{
  position:absolute; left:0; right:0; bottom:18px; text-align:center;
  font-size:12px; color:var(--ink-3); pointer-events:none; letter-spacing:.5px;
}
.fb-banner{
  border-radius:var(--r-md); padding:16px 18px; margin-top:20px;
  display:flex; gap:14px; align-items:center;
}
.fb-banner.good{background:var(--green-bg)}
.fb-banner.bad{background:var(--red-bg)}
.fb-banner .fb-ic{flex:none; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff}
.fb-banner.good .fb-ic{background:var(--green)}
.fb-banner.bad .fb-ic{background:var(--red)}
.fb-banner .fb-t{font-weight:900; font-size:17px}
.fb-banner .fb-d{font-size:13.5px; color:var(--ink-2); margin-top:2px}
.fb-banner .fb-d b{color:var(--ink)}
.quiz-next{margin-top:22px; display:flex; justify-content:center}

/* ============ 结果 ============ */
.result-hero{text-align:center; padding:30px 24px}
.score-ring{
  width:150px; height:150px; border-radius:50%; margin:10px auto 16px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--sun-bg); border:6px solid var(--sun);
}
.score-ring .s-num{font-size:44px; font-weight:900; line-height:1}
.score-ring .s-lab{font-size:13px; font-weight:700; color:#8A6312}

.stars-row svg{width:34px; height:34px}

.res-msg{font-size:18px; font-weight:900}
.review-item{display:flex; gap:12px; padding:13px 0; border-bottom:1px dashed var(--line); align-items:flex-start}

.review-item .r-ic.ok{background:var(--green)}
.review-item .r-ic.no{background:var(--red)}
.review-item .r-t{font-weight:900; font-size:15px; word-break:break-word}
.review-item .r-d{font-size:13px; color:var(--ink-2); margin-top:1px}
.review-item .r-ans{font-size:13px; margin-top:2px; font-weight:700; color:var(--green-d)}
.review-item .r-wrong{font-size:13px; margin-top:1px; font-weight:700; color:var(--red)}

/* ============ 错题本 ============ */
.wb-sum{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.wb-item{display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px dashed var(--line)}
.wb-item:last-child{border-bottom:none}
.wb-item .wi-main{flex:1; min-width:0}
.wb-item .wi-en{font-size:18px; font-weight:700}
.wb-item .wi-zh{font-size:13px; color:var(--ink-2)}
.wb-item .wi-ipa{font-size:12px; color:var(--ink-3); font-family:Consolas,monospace}
.wb-prog{flex:none; display:flex; gap:5px; align-items:center}
.wb-prog i{width:12px; height:12px; border-radius:50%; background:var(--line)}
.wb-prog i.on{background:var(--green)}
.empty{
  text-align:center; padding:44px 20px; color:var(--ink-2);
}
.empty .e-ic{width:64px; height:64px; margin:0 auto 12px; opacity:.4}

.help-sec{margin-bottom:16px}
.help-sec h3{font-size:17px; font-weight:900; display:flex; align-items:center; gap:8px; margin-bottom:8px}
.help-sec p, .help-sec li{font-size:14px; color:var(--ink-2)}
.help-sec ul{padding-left:20px}
.help-sec li{margin-top:4px}
.help-sec code{

  font-family:Consolas,monospace; font-size:13px; color:var(--blue-d);
}

.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:#FFFFFF;
  border-top:1px solid var(--line);
  display:flex; justify-content:space-around; padding:6px 6px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 20px rgba(39,76,119,.06);
}
.tab{
  flex:1; max-width:130px; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:6px 0 2px; border-radius:14px; color:var(--ink-3); font-size:11px; font-weight:700;
  transition:color .15s;
}
.tab svg{width:24px; height:24px}
.tab.on{color:var(--blue)}
.tab.on .tab-pill{background:var(--blue-bg)}
.tab .tab-pill{padding:3px 14px; border-radius:999px}
.tab-badge{
  position:absolute; transform:translate(14px,-4px);
  background:var(--coral); color:#fff; font-size:10px; font-weight:900;
  min-width:17px; height:17px; border-radius:999px; display:flex; align-items:center; justify-content:center;
}

#toast{
  position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px;
  font-size:14px; font-weight:700; z-index:100; opacity:0; pointer-events:none;
  transition:all .25s; max-width:86vw; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.18);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.modal-mask{
  position:fixed; inset:0; z-index:80; background:rgba(24,48,74,.45);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal{
  background:var(--card); border-radius:var(--r-lg); padding:24px; width:100%; max-width:440px;
  box-shadow:0 24px 60px rgba(0,0,0,.25); max-height:86vh; overflow-y:auto;
}
.modal h3{font-size:19px; font-weight:900; margin-bottom:12px}
.modal p{font-size:14px; color:var(--ink-2); margin-bottom:12px}
.modal .m-row{display:flex; gap:10px; margin-top:18px}
.modal .m-row .btn{flex:1}
.field{margin-bottom:12px}
.field label{display:block; font-size:13px; font-weight:900; color:var(--ink-2); margin-bottom:6px}
.field input{
  width:100%; min-height:46px; border-radius:13px; border:2px solid var(--line);
  padding:0 14px; font-size:15px; outline:none; background:var(--card);
}
.field input:focus{border-color:var(--blue)}

  .opt-grid{grid-template-columns:1fr}
  .type-row{flex-direction:column}
  .type-row .btn{width:100%}
  .dlg-line{grid-template-columns:44px 1fr}
  .view-title{font-size:26px}
}
@media (prefers-reduced-motion:reduce){

function autoIpa(en){
  const k = normWord(en);
  if (IPA_DICT[k]) return IPA_DICT[k];
  const words = k.split(" ").map(w => IPA_DICT[w]).filter(Boolean);
  if (words.length && words.length === k.split(" ").length) return words.join(" ");
  return "";
}
function autoLineIpa(en){
  const k = normWord(en);
  if (IPA_DICT[k]) return IPA_DICT[k];
  const words = k.split(" ").map(w => IPA_DICT[w]).filter(Boolean);
  return words.length ? words.join(" ") : "";
}

const LS_KEY = "aenet-state-v1";
const defaultState = () => ({ course: null, mastery: {}, stars: 0, exams: 0, totalQ: 0, correctQ: 0 });
let S = defaultState();
function saveState(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }
function loadState(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) S = Object.assign(defaultState(), JSON.parse(raw));
  } catch(e) {}
}
function resetAll(){
  S = defaultState(); saveState();
  render(); go("#/home"); toast("已重置全部数据");
}
/* 词条 id：单元内 words 与 dialogue 句子统一编号 */
function collectItems(unit){
  const items = [];
  unit.words.forEach((w, i) => { items.push(Object.assign({}, w, {_id: unit.id + "::w" + i, _unitId: unit.id, _unitTitle: unit.title, _kind: w.phrase ? "phrase" : "word"})); });
  unit.dialogues.forEach(d => {
    d.lines.forEach((l, i) => {
      items.push({en: l.en, zh: l.zh, ipa: l.ipa || "", _id: unit.id + "::d" + d.id + "::" + i, _unitId: unit.id, _unitTitle: unit.title, _kind: "dialogue", _who: l.who, _dlgTitle: d.title});
    });
  });
  return items;
}
function getMastery(id){ return S.mastery[id] || {consecutive: 0, wrongCount: 0, status: "new", lastWrongAt: 0, lastOkAt: 0, history: []}; }
function recordResult(item, ok){
  const m = getMastery(item._id);
  m.history = (m.history || []).slice(-60);
  m.history.push({ok, t: Date.now()});
  if (ok) {
    m.consecutive = (m.consecutive || 0) + 1;
    m.lastOkAt = Date.now();
    if (m.consecutive >= 3) m.status = "mastered";
    else if (m.status === "new") m.status = "learning";
  } else {
    m.consecutive = 0;
    m.wrongCount = (m.wrongCount || 0) + 1;
    m.status = "learning";
    m.lastWrongAt = Date.now();
  }
  S.mastery[item._id] = m;
  if (ok) S.stars += 1;
  S.totalQ += 1; S.correctQ += ok ? 1 : 0;
  saveState();
  return m;
}
function allItems(){
  if (!S.course) return [];
  return S.course.units.flatMap(collectItems);
}
function wrongItems(){
  return allItems().filter(it => getMastery(it._id).wrongCount > 0)
    .sort((a, b) => getMastery(b._id).lastWrongAt - getMastery(a._id).lastWrongAt);
}
function unitProgress(unit){
  const items = collectItems(unit);
  const mastered = items.filter(it => getMastery(it._id).status === "mastered").length;
  return { total: items.length, mastered };
}
function courseStats(){
  const items = allItems();
  const mastered = items.filter(it => getMastery(it._id).status === "mastered").length;
  const learning = items.filter(it => getMastery(it._id).status === "learning").length;
  return { total: items.length, mastered, learning, wrong: wrongItems().filter(it => getMastery(it._id).status !== "mastered").length };
}

/* ================= 课程文本解析 ================= */
const CN_NUM = {一:1, 二:2, 两:2, 三:3, 四:4, 五:5, 六:6, 七:7, 八:8, 九:9, 十:10, 百:100};
function cnNum(s){
  if (!s) return 0;
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  let n = 0, t = 0;
  for (const ch of s) {
    if (ch === "十") { n += (t || 1) * 10; t = 0; }
    else if (CN_NUM[ch]) t = CN_NUM[ch];
    else if (ch === "零") t = 0;
  }
  return n + t;
}
function matchUnitHeader(line){
  let m;
  m = line.match(/^(?:unit|lesson)\s*(\d+)\s*[:：.\-—]?\s*(.*)$/i);
  if (m) return { n: parseInt(m[1], 10), title: m[2].trim() };
  m = line.match(/^第?\s*(\d+)\s*(?:课|单元|课单元)\s*[:：.\-—]?\s*(.*)$/);
  if (m) return { n: parseInt(m[1], 10), title: m[2].trim() };
  m = line.match(/^第\s*([一二三四五六七八九十百两]+)\s*课\s*[:：.\-—]?\s*(.*)$/);
  if (m) return { n: cnNum(m[1]), title: m[2].trim() };
  m = line.match(/^(?:单元|课)\s*(\d+)\s*[:：.\-—]?\s*(.*)$/);
  if (m) return { n: parseInt(m[1], 10), title: m[2].trim() };
  m = line.match(/^(\d+)\s*[.、．]\s*(.*)$/);
  if (m) return { n: parseInt(m[1], 10), title: m[2].trim() };
  m = line.match(/^([一二三四五六七八九十百两]+)\s*[、.．]\s*(.*)$/);
  if (m) return { n: cnNum(m[1]), title: m[2].trim() };
  return null;
}
function splitEnZh(rest){
  const zhIdx = rest.search(/[\u4e00-\u9fa5]/);
  if (zhIdx < 0) return { en: rest.trim(), zh: "" };
  return { en: rest.slice(0, zhIdx).trim(), zh: rest.slice(zhIdx).trim() };
}
function parseWordLine(raw){
  let line = raw, ipa = "";
  const ipaM = line.match(/\/[^/]+\//);
  if (ipaM) { ipa = ipaM[0]; line = line.replace(ipaM[0], " ").replace(/\s+/g, " ").trim(); }
  const zhIdx = line.search(/[\u4e00-\u9fa5]/);
  if (zhIdx < 0) return null;
  let en = line.slice(0, zhIdx).trim();
  const zh = line.slice(zhIdx).trim();
  en = en.replace(/^[:\-|·—=,，.。\s]+|[:\-|·—=,，.。\s]+$/g, "").trim().replace(/[‘’]/g, "'").replace(/\s+/g, " ").trim();
  if (!/^[A-Za-z]/.test(en) || !zh || en.includes(":") || en.length > 40) return null;
  return { en, zh, ipa };
}
function parseDialogueLine(line){
  let who = "", rest = line;
  const m = line.match(/^([^:：]{1,16}?)[:：]\s*(.*)$/);
  if (m && /^[A-Za-z\u4e00-\u9fa5 .'’\-]+$/.test(m[1])) { who = m[1].trim(); rest = m[2]; }
  const s = splitEnZh(rest);
  const en = s.en.replace(/[‘’]/g, "'").replace(/\s+/g, " ").trim();
  if (!en) return null;
  return { who: who || "A", en, zh: s.zh, ipa: autoLineIpa(en) };
}
function parseCourseText(rawText, title){
  const lines = String(rawText || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const units = [];
  let cur = null, section = "words";
  const mkUnit = (t) => ({ id: "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: t, zh: "", words: [], dialogues: [] });
  for (const line of lines) {
    const uh = matchUnitHeader(line);
    if (uh) {
      cur = mkUnit(uh.title || ("Unit " + uh.n));
      units.push(cur); section = "words"; continue;
    }
    if (/^(对话|dialogue|conversation|情景对话|角色扮演|let's talk|let’s talk|lets talk|role play|talk)/i.test(line)) {
      section = "dialogue";
      if (!cur) { cur = mkUnit(units.length ? "补充单元" : "未命名单元"); units.push(cur); }
      const t = line.replace(/^(对话|dialogue|conversation|情景对话|角色扮演|let's talk|let’s talk|lets talk|role play|talk)[:：\-—]?\s*/i, "").trim();
      cur.dialogues.push({ id: "d" + cur.dialogues.length, title: t || "对话", zh: "", lines: [] });
      continue;
    }
    if (!cur) { cur = mkUnit(units.length ? "补充单元" : "未命名单元"); units.push(cur); }
    if (section === "dialogue") {
      const dl = parseDialogueLine(line);
      if (dl) {
        if (!cur.dialogues.length) cur.dialogues.push({ id: "d" + cur.dialogues.length, title: "对话", zh: "", lines: [] });
        const dlg = cur.dialogues[cur.dialogues.length - 1];
        if (!dlg.lines) dlg.lines = [];
        dlg.lines.push(dl);
        continue;
      }
    }
    const w = parseWordLine(line);
    if (w) {
      if (!w.ipa) w.ipa = autoIpa(w.en);
      w.phrase = w.en.includes(" ") ? true : undefined;
      cur.words.push(w);
    }
  }
  units.forEach(u => u.dialogues.forEach(d => { if (!d.lines) d.lines = []; }));
  return units.filter(u => u.words.length || u.dialogues.length);
}

/* ================= 语音：朗读 + 口说识别 ================= */
function speak(text, lang){
  if (!("speechSynthesis" in window)) { toast("当前浏览器不支持语音朗读"); return; }
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || "en-US";
    u.rate = 0.82; u.pitch = 1.05; u.volume = 1;
    const vs = window.speechSynthesis.getVoices();
    const v = vs.find(x => x.lang && x.lang.toLowerCase().startsWith((lang || "en-US").slice(0, 2).toLowerCase()));
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  } catch(e) { toast("朗读失败，请重试"); }
}
function speakEn(t){ speak(t, "en-US"); }
function speakZh(t){ speak(t, "zh-CN"); }
let asr = null;
function asrSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function startAsr(onResult, onEnd){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return false;
  stopAsr();
  const r = new SR();
  r.lang = "en-US"; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
  let final = "";
  r.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t; else interim += t;
    }
    onResult((final || interim).trim(), !!final);
  };
  r.onerror = e => { onEnd && onEnd(false, e.error || "error"); };
  r.onend = () => { if (onEnd) onEnd(true); };
  asr = r;
  try { r.start(); return true; } catch(e) { return false; }
}
function stopAsr(){ try { asr && asr.stop(); } catch(e){} }

/* ================= 手写：画布 + 字形匹配评分 ================= */
function setupCanvas(canvas, onChanged){
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let drawing = false;
  function resize(){
    const w = canvas.clientWidth || 340, h = canvas.clientHeight || 170;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
    ctx.lineWidth = 10; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = "#274C77";
  }
  resize();
  const pos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  canvas.addEventListener("pointerdown", e => {
    drawing = true;
    try { canvas.setPointerCapture(e.pointerId); } catch(err){}
    const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y);
  });
  canvas.addEventListener("pointermove", e => { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
  const up = () => { if (drawing) { drawing = false; onChanged && onChanged(); } };
  canvas.addEventListener("pointerup", up);
  canvas.addEventListener("pointerleave", up);
  return {
    clear(){ ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr); onChanged && onChanged(); },
    isEmpty(){
      const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      for (let i = 3; i < d.length; i += 4) if (d[i] > 40) return false;
      return true;
    },
    getGrid(){
      const w = canvas.width, h = canvas.height;
      const d = ctx.getImageData(0, 0, w, h).data;
      let minX = w, minY = h, maxX = -1, maxY = -1;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)
        if (d[(y * w + x) * 4 + 3] > 40) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
      if (maxX < 0) return null;
      const bw = maxX - minX + 1, bh = maxY - minY + 1, G = 24, H = 12;
      const grid = new Float32Array(G * H);
      for (let y = 0; y < H; y++) for (let x = 0; x < G; x++) {
        const x0 = minX + Math.floor(bw * x / G), x1 = Math.min(minX + Math.floor(bw * (x + 1) / G), w);
        const y0 = minY + Math.floor(bh * y / H), y1 = Math.min(minY + Math.floor(bh * (y + 1) / H), h);
        let sum = 0, c = 0;
        for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) { sum += d[(yy * w + xx) * 4 + 3]; c++; }
        grid[y * G + x] = c ? sum / c / 255 : 0;
      }
      return grid;
    }
  };
}
function refGridFor(text){
  const c = document.createElement("canvas");
  c.width = 720; c.height = 240;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 720, 240);
  ctx.font = '118px "Baloo 2", "Comic Sans MS", "Segoe Print", "Chalkboard SE", cursive';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#000";
  ctx.fillText(text, 360, 132);
  const d = ctx.getImageData(0, 0, 720, 240).data;
  let minX = 720, minY = 240, maxX = -1, maxY = -1;
  for (let y = 0; y < 240; y++) for (let x = 0; x < 720; x++)
    if (d[(y * 720 + x) * 4 + 3] > 40) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  if (maxX < 0) return null;
  const bw = maxX - minX + 1, bh = maxY - minY + 1, G = 24, H = 12;
  const grid = new Float32Array(G * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < G; x++) {
    const x0 = minX + Math.floor(bw * x / G), x1 = Math.min(minX + Math.floor(bw * (x + 1) / G), 720);
    const y0 = minY + Math.floor(bh * y / H), y1 = Math.min(minY + Math.floor(bh * (y + 1) / H), 240);
    let sum = 0, c = 0;
    for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) { sum += d[(yy * 720 + xx) * 4 + 3]; c++; }
    grid[y * G + x] = c ? sum / c / 255 : 0;
  }
  return grid;
}
function gradeHandwriting(inputGrid, ref){
  if (!inputGrid || !ref) return { iou: 0, coverage: 0, pass: false };
  let inter = 0, union = 0, refInk = 0;
  for (let i = 0; i < inputGrid.length; i++) {
    const a = inputGrid[i] > 0.25, b = ref[i] > 0.25;
    if (b) refInk++;
    if (a && b) inter++;
    if (a || b) union++;
  }
  const iou = union ? inter / union : 0;
  const coverage = refInk ? inter / refInk : 0;
  return { iou: Math.round(iou * 100), coverage: Math.round(coverage * 100), pass: iou >= 0.34 && coverage >= 0.5 };
}

let QUIZ_CFG = null;

function buildQuiz(cfg){
  let items = allItems();
  if (cfg.unitIds && cfg.unitIds.length) items = items.filter(it => cfg.unitIds.includes(it._unitId));
  if (cfg.source === "wrong") {
    items = wrongItems().filter(it => getMastery(it._id).status !== "mastered");
  }
  if (cfg.itemIds && cfg.itemIds.length) items = items.filter(it => cfg.itemIds.includes(it._id));
  const kindSet = new Set(cfg.kinds);
  items = items.filter(it => kindSet.has(it._kind));
  const diffKinds = cfg.diff === 1 ? ["word"] : cfg.diff === 2 ? ["word", "phrase"] : ["word", "phrase", "dialogue"];
  items = items.filter(it => diffKinds.includes(it._kind));
  if (!items.length) return { error: cfg.source === "wrong" ? "错题本里没有符合当前筛选的题目" : "当前筛选下没有可考的题目，请调整单元、题型或难度" };
  const modes = cfg.modes;
  const pool = [];
  for (const it of items) {
    let fmts = it._kind === "dialogue" ? modes.filter(m => ["speak", "e2c", "c2e"].includes(m)) : modes.slice();
    if (cfg.diff === 1) fmts = fmts.filter(m => !(m === "type" || m === "write") || normWord(it.en).length <= 6);
    if (it._kind !== "dialogue" && normWord(it.en).replace(/ /g, "").length > 12) fmts = fmts.filter(m => !["type", "write"].includes(m));
    for (const f of fmts) pool.push({ item: it, mode: f });
  }
  if (!pool.length) return { error: "当前筛选下没有可考的题目，请调整考核方式或难度" };
  const n = cfg.count && cfg.count !== "all" ? Math.min(cfg.count, pool.length) : pool.length;
  const picked = sample(pool, n);
  const questions = picked.map(p => makeQuestion(p.item, p.mode, items));
  return { questions };
}
function distractorPool(item, items, field){
  const seen = new Set([item[field]]);
  const out = [];
  for (const it of shuffle(items)) {
    const v = it[field];
    if (v && !seen.has(v)) { seen.add(v); out.push(v); }
    if (out.length >= 3) break;
  }
  return out;
}
function makeQuestion(item, mode, items){
  const q = { item, mode, answer: item.en };
  if (mode === "e2c") {
    const opts = shuffle([item.zh].concat(distractorPool(item, items, "zh")));
    while (opts.length < 4) opts.push("以上都不是");
    q.options = opts.slice(0, 4);
    q.answer = item.zh;
  } else if (mode === "c2e") {
    const opts = shuffle([item.en].concat(distractorPool(item, items, "en")));
    while (opts.length < 4) opts.push("以上都不是");
    q.options = opts.slice(0, 4);
    q.answer = item.en;
  }
  return q;
}
function startQuiz(cfg){
  const res = buildQuiz(cfg);
  if (res.error) { toast(res.error); return false; }
  QUIZ_CFG = Object.assign({}, cfg);
  QUIZ = {
    questions: res.questions,
    idx: 0,
    correct: 0,
    results: [],
    cur: { answered: false, correct: false, picked: null, asrText: "", writeScore: null }
  };
  renderQuiz();
  return true;
}
function quizFinish(){
  S.exams += 1; saveState();
  renderResult();
}
function submitAnswer(ok){
  if (QUIZ.cur.answered) return;
  const q = QUIZ.questions[QUIZ.idx];
  QUIZ.cur.answered = true;
  QUIZ.cur.correct = ok;
  if (ok) QUIZ.correct++;
  QUIZ.results.push({ q, ok, my: QUIZ.cur.picked !== null ? QUIZ.cur.picked : (QUIZ.cur.asrText || (QUIZ.cur.writeScore !== null ? "手写作答" : "")) });
  recordResult(q.item, ok);
  renderQuiz();
}
function quizNext(){
  QUIZ.idx++;
  if (QUIZ.idx >= QUIZ.questions.length) { quizFinish(); return; }
  QUIZ.cur = { answered: false, correct: false, picked: null, asrText: "", writeScore: null };
  renderQuiz();
}

      }

    }).join("")}</div>`;

    answer = `<div class="type-row">
        <input id="typeInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入英文…" ${cur.answered ? "disabled" : ""}>
        <button class="btn sm" id="btnType" ${cur.answered ? "disabled" : ""}>${IC.check} 检查</button>
      </div>`;
  } else if (q.mode === "speak") {
    answer = `<div class="speak-area">
        <div class="mic-btn" id="micBtn">${IC.mic}</div>
        <div class="asr-line" id="asrLine">${cur.answered ? "" : "点一下麦克风，然后开始说"}</div>
        ${q.item._kind === "dialogue" && !cur.answered ? `<button class="btn ghost sm" id="btnDemo" style="margin-top:12px">${IC.sound} 听示范</button>` : ""}
        <div id="speakCheck"></div>

  } else if (q.mode === "write") {
    answer = `<div class="hw-area">
        <div class="hw-canvas-wrap">

          <div class="hw-guide">在此书写区写字</div>

function feedbackBanner(q, cur){
  const ok = cur.correct;
  if (ok) {
    return `<div class="fb-banner good">
      <div class="fb-ic">${IC.check}</div>
      <div><div class="fb-t">答对了，真棒！</div>
      <div class="fb-d">${esc(q.item.en)} ${esc(q.item.ipa || "")} · ${esc(q.item.zh)}</div></div>
    </div>`;
  }
  return `<div class="fb-banner bad">
    <div class="fb-ic">${IC.x}</div>
    <div><div class="fb-t">没关系，记住它</div>
    <div class="fb-d">正确答案：<b>${esc(q.item.en)}</b> ${esc(q.item.ipa || "")} · ${esc(q.item.zh)}</div>
    <div class="fb-d">已自动加入错题本，连对 3 次才会通过</div></div>
  </div>`;
}
function bindQuizEvents(q, cur){
  const btnQuit = $("#btnQuit");
  if (btnQuit) btnQuit.onclick = () => {
    modal(`<h3>退出考试？</h3><p>已答 ${QUIZ.results.length} 题，退出后本次成绩不保留。</p>
      <div class="m-row"><button class="btn ghost" onclick="closeModal()">继续答题</button><button class="btn coral" onclick="quitQuiz()">退出</button></div>`);
  };
  if (cur.answered) {
    const btnNext = $("#btnNext");
    if (btnNext) btnNext.onclick = quizNext;
    return;
  }
  if (q.mode === "e2c" || q.mode === "c2e") {
    $$(".opt", $("#view")).forEach(b => b.onclick = () => {
      if (cur.answered) return;
      const i = parseInt(b.dataset.opt, 10);
      cur.picked = q.options[i];
      submitAnswer(q.options[i] === q.answer);
    });
  } else if (q.mode === "type") {
    const input = $("#typeInput"), btn = $("#btnType");
    const trySubmit = () => {
      const v = input.value;
      if (!v.trim()) { toast("先输入你的答案"); return; }
      cur.picked = v;
      submitAnswer(normWord(v) === normWord(q.answer));
    };
    btn.onclick = trySubmit;
    input.addEventListener("keydown", e => { if (e.key === "Enter") trySubmit(); });
    input.focus();
  } else if (q.mode === "speak") {
    const micBtn = $("#micBtn"), line = $("#asrLine"), ck = $("#speakCheck");
    let listening = false;
    const demoBtn = $("#btnDemo");
    if (demoBtn) demoBtn.onclick = () => speakEn(q.item.en);
    const showSpeakCheck = () => {
      if (cur.answered) return;
      ck.innerHTML = `<div class="self-check">
        <button class="btn green sm" id="spOk">${IC.check} 我说对了</button>
        <button class="btn coral sm" id="spNo">${IC.x} 说错了</button>
      </div>`;
      $("#spOk").onclick = () => submitAnswer(true);
      $("#spNo").onclick = () => submitAnswer(false);
    };
    micBtn.onclick = () => {
      if (listening) { stopAsr(); listening = false; micBtn.classList.remove("listening"); return; }
      if (!asrSupported()) {
        line.textContent = "当前浏览器不支持语音识别，请用自我判定";
        showSpeakCheck();
        return;
      }
      listening = true;
      micBtn.classList.add("listening");
      line.textContent = "正在听… 请大声说";
      const ok = startAsr((text, isFinal) => {
        line.textContent = text ? "听到：" + text : "正在听…";
        cur.asrText = text;
        if (isFinal) {
          stopAsr();
          if (fuzzyMatch(text, q.answer)) { line.textContent = "听得很清楚，答对了！"; submitAnswer(true); }
          else { line.textContent = "听到：" + text; showSpeakCheck(); }
        }
      }, (okFlag, err) => {
        listening = false;
        micBtn.classList.remove("listening");
        line.textContent = "没有听清，再说一次或用自我判定";
        showSpeakCheck();
      });
      if (!ok) { listening = false; micBtn.classList.remove("listening"); showSpeakCheck(); }
    };
  } else if (q.mode === "write") {
    const canvas = $("#hwCanvas");
    const hw = setupCanvas(canvas, () => {});
    const ck = $("#hwCheck");
    $("#btnHwClear").onclick = () => { hw.clear(); ck.innerHTML = ""; };
    $("#btnHwCheck").onclick = () => {
      if (hw.isEmpty()) { toast("先写出你的答案"); return; }
      const score = gradeHandwriting(hw.getGrid(), refGridFor(q.answer));
      cur.writeScore = score.pass ? "通过" : "待判定";
      if (score.pass) {
        ck.innerHTML = `<div class="fb-banner good" style="margin-top:0"><div class="fb-ic">${IC.check}</div>
          <div><div class="fb-t">字写得对，好棒！</div><div class="fb-d">字形匹配度 ${score.iou}%</div></div></div>`;
        submitAnswer(true);
      } else {
        ck.innerHTML = `<div class="fb-banner bad" style="margin-top:0"><div class="fb-ic">${IC.x}</div>
          <div><div class="fb-t">机器没认出来（匹配 ${score.iou}%），以你为准</div>
          <div class="fb-d">如果你觉得写对了，就点"我写对了"</div></div></div>
          <div class="self-check">
            <button class="btn green sm" id="hwOk">${IC.check} 我写对了</button>
            <button class="btn coral sm" id="hwNo">${IC.x} 写错了</button>
          </div>`;
        $("#hwOk").onclick = () => submitAnswer(true);
        $("#hwNo").onclick = () => submitAnswer(false);
      }
    };
  }
}

  return { base: parts[0] || "home", param: parts[1] || "" };
}
function go(h){
  location.hash = h;
  window.scrollTo(0, 0);
}
function render(){

  $$(".tab", $("#tabbar")).forEach(t => t.classList.toggle("on", t.dataset.route === (tabMap[base] || "")));
  const wb = wrongItems().filter(it => getMastery(it._id).status !== "mastered").length;

  if (badge) { badge.textContent = wb; badge.classList.toggle("hidden", wb === 0); }
  const stars = $("#topStars");
  if (stars) stars.textContent = S.stars;

  const views = { home: renderHome, course: renderCourse, import: renderImport, unit: renderUnit, exam: renderExam, wrongbook: renderWrongBook, help: renderHelp };
  const fn = views[base];
  if (!fn) { location.hash = "#/home"; return; }
  fn(param);
}

function exportCourse(){
  const c = S.course;
  if (!c) return;
  const lines = [c.title, ""];
  c.units.forEach((u, i) => {
    lines.push(`Unit ${i + 1}: ${u.title}`);
    u.words.forEach(w => lines.push(`${w.en}${w.ipa ? " " + w.ipa : ""} ${w.zh}`));
    if (u.dialogues.length) {
      lines.push("对话");
      u.dialogues.forEach(d => (d.lines || []).forEach(l => lines.push(`${l.who}: ${l.en} ${l.zh}`)));
    }
    lines.push("");
  });
  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Aenet课程_" + c.title.slice(0, 12) + ".txt";
  a.click();
  toast("课程已导出为文本");
}

let EX_CFG = null;
function defaultExamCfg(){

    kinds: ["word", "phrase", "dialogue"],

function renderExam(){
  if (!S.course) {
    $("#view").innerHTML = `
      <div class="view-head"><div class="view-title">考试</div></div>
      <div class="card empty"><div class="e-ic" style="color:var(--blue)">${IC.flag}</div>

  }
  if (!EX_CFG || !EX_CFG.unitIds.length) EX_CFG = defaultExamCfg();
  const cfg = EX_CFG;
  const unitChips = S.course.units.map((u, i) => `<button class="chip ${cfg.unitIds.includes(u.id) ? "on" : ""}" data-unit="${u.id}"><span class="ck">${IC.check}</span>${i + 1}. ${esc(u.title)}</button>`).join("");
  const kindChips = ["word", "phrase", "dialogue"].map(k => `<button class="chip green ${cfg.kinds.includes(k) ? "on" : ""}" data-kind="${k}"><span class="ck">${IC.check}</span>${KIND_META[k].label} <span style="font-weight:500;opacity:.8">${KIND_META[k].desc}</span></button>`).join("");
  const modeChips = ["speak", "type", "write", "e2c", "c2e"].map(m => `<button class="chip coral ${cfg.modes.includes(m) ? "on" : ""}" data-mode="${m}"><span class="ck">${IC.check}</span>${MODE_META[m].icon} ${MODE_META[m].label}</button>`).join("");
  const diffCards = DIFF_META.map((d, i) => `<div class="diff-card ${cfg.diff === i + 1 ? "on" : ""}" data-diff="${i + 1}">
    <div class="d-n">${d.n}</div><div class="d-l">${d.label}</div><div class="d-s">${d.desc}</div></div>`).join("");
  const countChips = [5, 10, 15, "all"].map(n => `<button class="chip sun ${String(cfg.count) === String(n) ? "on" : ""}" data-count="${n}"><span class="ck">${IC.check}</span>${n === "all" ? "全部" : n + " 题"}</button>`).join("");
  $("#view").innerHTML = `
    <div class="view-head"><div class="view-title">生成考试</div><div class="view-sub">选择单元、题型、考核方式与难度，系统自动组卷</div></div>
    <div class="card">
      <div class="exam-sec">
        <div class="sec-lab">${IC.book} 考试单元 <span class="tip">可多选</span></div>
        <div class="chip-row">${unitChips}</div>
      </div>
      <div class="exam-sec">
        <div class="sec-lab">${IC.bulb} 考试内容 <span class="tip">可多选</span></div>
        <div class="chip-row">${kindChips}</div>
      </div>
      <div class="exam-sec">
        <div class="sec-lab">${IC.pen} 考核方式 <span class="tip">可多选</span></div>
        <div class="chip-row">${modeChips}</div>
      </div>
      <div class="exam-sec">
        <div class="sec-lab">${IC.trophy} 难度 <span class="tip">单选</span></div>
        <div class="diff-grid">${diffCards}</div>
      </div>
      <div class="exam-sec">
        <div class="sec-lab">${IC.flag} 题量 <span class="tip">单选</span></div>
        <div class="chip-row">${countChips}</div>
      </div>
      <button class="btn coral block" id="btnStartExam" style="margin-top:6px">${IC.flag} 开始考试</button>
      <div class="rule-note">${IC.bulb}<span><strong>掌握规则：</strong>答错的题自动加入错题本；错题可反复考核，直到<strong>连续答对 3 次</strong>才被标记为"已掌握"。</span></div>
    </div>`;
  $$(".chip[data-unit]", $("#view")).forEach(b => b.onclick = () => {
    const id = b.dataset.unit;
    if (cfg.unitIds.includes(id)) cfg.unitIds = cfg.unitIds.filter(x => x !== id);
    else cfg.unitIds.push(id);
    if (!cfg.unitIds.length) cfg.unitIds = S.course.units.map(u => u.id);
    renderExam();
  });
  $$(".chip[data-kind]", $("#view")).forEach(b => b.onclick = () => {

    const m = b.dataset.mode;

    if (!cfg.modes.length) cfg.modes = ["e2c"];
    renderExam();
  });
  $$(".diff-card", $("#view")).forEach(c => c.onclick = () => { cfg.diff = parseInt(c.dataset.diff, 10); renderExam(); });
  $$(".chip[data-count]", $("#view")).forEach(b => b.onclick = () => { cfg.count = b.dataset.count === "all" ? "all" : parseInt(b.dataset.count, 10); renderExam(); });
  $("#btnStartExam").onclick = () => {
    const q = buildQuiz(Object.assign({}, cfg));
    if (q.error) { toast(q.error); return; }
    startQuiz(Object.assign({}, cfg));
  };
}

/* ===== 错题本 ===== */
function renderWrongBook(){
  const items = wrongItems();
  const active = items.filter(it => getMastery(it._id).status !== "mastered");
  const near = active.filter(it => getMastery(it._id).consecutive >= 2);
  const mastered = items.filter(it => getMastery(it._id).status === "mastered");
  const list = active.concat(mastered);
  const listHtml = list.length ? list.map(it => {
    const m = getMastery(it._id);
    const masteredFlag = m.status === "mastered";
    const dots = Math.min(m.consecutive, 3);
    return `<div class="wb-item">
      <div style="flex:1; min-width:0">
        <div class="wi-en en">${esc(it.en)} ${it._kind === "phrase" ? `<span class="wc-tag">短语</span>` : it._kind === "dialogue" ? `<span class="wc-tag">对话</span>` : ""}</div>
        <div class="wi-zh">${esc(it.zh)} <span class="wi-ipa">${esc(it.ipa || "")}</span></div>
        <div class="wi-zh" style="font-size:12px">${esc(it._unitTitle)} · 共错 ${m.wrongCount} 次</div>
      </div>
      <div style="text-align:center">
        <div class="wb-prog">${[0,1,2].map(k => `<i class="${k < dots ? "on" : ""}"></i>`).join("")}</div>
        <div style="font-size:11px; color:var(--ink-3); margin-top:3px">${masteredFlag ? "已掌握" : "连对 " + m.consecutive + "/3"}</div>
      </div>
      <button class="mini-btn ${masteredFlag ? "" : "coral"}" title="${masteredFlag ? "再练一遍" : "重练这道题"}" onclick="retestItem('${it._id}')">${IC.refresh}</button>
    </div>`;
  }).join("") : `<div class="empty"><div class="e-ic" style="color:var(--green)">${IC.star}</div>
    <div style="font-weight:900; font-size:17px">还没有错题</div>
    <p style="font-size:14px; margin-top:4px">考试中答错的题会自动出现在这里，连对 3 次即可掌握。</p></div>`;
  $("#view").innerHTML = `
    <div class="view-head"><div class="view-title">错题本</div><div class="view-sub">错题反复考核，连续答对 3 次 = 已掌握</div></div>
    <div class="wb-sum" style="margin-bottom:16px">
      <div class="stat-card"><div class="ic" style="color:var(--coral)">${IC.x}</div><div class="num">${active.length}</div><div class="lab">待攻克</div></div>
      <div class="stat-card"><div class="ic" style="color:var(--sun-d)">${IC.spark}</div><div class="num">${near.length}</div><div class="lab">接近掌握</div></div>
      <div class="stat-card"><div class="ic" style="color:var(--green)">${IC.check}</div><div class="num">${mastered.length}</div><div class="lab">已掌握</div></div>
    </div>
    <div style="display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap">
      <button class="btn coral" onclick="retestWrong()" ${active.length ? "" : "disabled"}>${IC.refresh} 错题重考（${active.length} 题）</button>
      <button class="btn ghost" onclick="go('#/exam')">${IC.flag} 去普通考试</button>
    </div>
    <div class="card">${listHtml}</div>`;
}
function retestItem(itemId){
  const cfg = Object.assign({}, defaultExamCfg(), { source: "wrong", itemIds: [itemId], count: "all", diff: 3 });
  startQuiz(cfg);
}
function retestWrong(){
  const active = wrongItems().filter(it => getMastery(it._id).status !== "mastered");
  if (!active.length) { toast("错题都攻克啦！"); return; }
  const cfg = Object.assign({}, defaultExamCfg(), { source: "wrong", count: "all", diff: 3 });
  startQuiz(cfg);
}

/* ===== 帮助 ===== */

  $("#view").innerHTML = `
    <div class="view-head"><div class="view-title">使用说明</div></div>
    <div class="card help-sec">
      <h3>${IC.upload} 1. 导入课程</h3>
      <p>上传课程内容与单字表（粘贴或 .txt / .md 文件）。按 <code>Unit 1:</code>、<code>第一课</code>、<code>1.</code> 等标题自动拆分单元；单词行自动补音标（内置常用词词典），未收录的显示"音标待补充"，可在单元页点铅笔手动编辑。</p>
    </div>
    <div class="card help-sec">
      <h3>${IC.book} 2. 单元重点整理</h3>
      <p>每个单元生成单字 / 短语卡片与对话逐句整理，包含国际音标与中文翻译，可点击喇叭听发音。</p>
    </div>
    <div class="card help-sec">
      <h3>${IC.flag} 3. 考试板块</h3>
      <ul>
        <li>考 <strong>单字、短语、对话</strong> 三类内容；</li>
        <li>考核方式五种：<strong>口说</strong>（浏览器语音识别，需 Chrome / Edge 并允许麦克风）、<strong>打字</strong>、<strong>手写</strong>（白板书写 + 字形匹配）、<strong>英翻中</strong>、<strong>中翻英</strong>；</li>
        <li>难度分 <strong>初级 / 中级 / 高级</strong> 三级：初级只考单字与短词，中级加入短语，高级加入对话句子朗读与理解。</li>
      </ul>
    </div>
    <div class="card help-sec">
      <h3>${IC.star} 4. 错题本与掌握判定</h3>
      <p>考核中答错的题<strong>自动加入错题本</strong>。错题可以反复考核，每次答对累计 1 次连续正确，答错则清零；<strong>连续答对 3 次</strong>后该题被标记为"已掌握"，从待攻克列表移除（保留在已掌握记录中）。</p>
    </div>
    <div class="card help-sec">
      <h3>${IC.info} 关于原型</h3>
      <ul>
        <li>数据保存在当前浏览器的本地存储中，不会上传到任何服务器；</li>
        <li>语音识别与朗读依赖浏览器能力，口说题同时提供"我说对了 / 说错了"自我判定兜底；</li>
        <li>手写评分采用字形匹配，仅作参考，孩子可自行判定；</li>
        <li>建议在电脑端 Chrome / Edge 上获得完整体验。</li>
      </ul>
    </div>`;
}

/* ================= 初始化 ================= */
function init(){
  loadState();
  if (!S.course) {
    S.course = makeTextbookCourse();
    saveState();
  }
  $$(".tab").forEach(t => t.addEventListener("click", () => go(t.dataset.route)));
  if ("speechSynthesis" in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }
  $("#btnReset").onclick = () => {
    modal(`<h3>重置全部数据？</h3><p>将清空课程、错题本、掌握记录与星星，此操作不可撤销。</p>
      <div class="m-row"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn coral" onclick="resetAll()">确认重置</button></div>`);
  };
  window.addEventListener("hashchange", render);
  render();
}
init();

/*__PART5__*/
</script>
